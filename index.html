<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phantom Studio</title>
  <meta name="description" content="Phantom Studio: commission Roblox scripting in Luau. Portfolio coming soon.">
  <style>
    :root { --bg: #0e0f12; --fg: #e8e9ec; --muted: #8b8f98; --accent: #8b7cf6; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: clamp(2rem, 7vw, 3.25rem); letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { margin-top: 16px; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Phantom <span>Studio</span></h1>
    <p>Commission Roblox scripting in Luau. Secure systems, safe data saving, tested before delivery.</p>
    <p>Portfolio launching soon.</p>
  </main>
</body>
</html>
